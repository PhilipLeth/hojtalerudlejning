<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Lyskæde med varmt hvidt lys">
  <defs>
    <radialGradient id="glowW" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffd27a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulbW" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset="0.6" stop-color="#ffdf94"/>
      <stop offset="1" stop-color="#e8b95c"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="#0d0c12"/>

  <!-- single draped chain -->
  <path d="M20 90 Q150 210 300 150 Q450 90 580 200" fill="none" stroke="#26252e" stroke-width="5" stroke-linecap="round"/>

  <!-- bulbs along the chain -->
  <g>
    <g transform="translate(70,133)"><circle r="34" fill="url(#glowW)"/><rect x="-5" y="-20" width="10" height="12" rx="2" fill="#33323c"/><circle cy="4" r="13" fill="url(#bulbW)"/></g>
    <g transform="translate(150,172)"><circle r="34" fill="url(#glowW)"/><rect x="-5" y="-20" width="10" height="12" rx="2" fill="#33323c"/><circle cy="4" r="13" fill="url(#bulbW)"/></g>
    <g transform="translate(230,172)"><circle r="34" fill="url(#glowW)"/><rect x="-5" y="-20" width="10" height="12" rx="2" fill="#33323c"/><circle cy="4" r="13" fill="url(#bulbW)"/></g>
    <g transform="translate(310,152)"><circle r="34" fill="url(#glowW)"/><rect x="-5" y="-20" width="10" height="12" rx="2" fill="#33323c"/><circle cy="4" r="13" fill="url(#bulbW)"/></g>
    <g transform="translate(390,130)"><circle r="34" fill="url(#glowW)"/><rect x="-5" y="-20" width="10" height="12" rx="2" fill="#33323c"/><circle cy="4" r="13" fill="url(#bulbW)"/></g>
    <g transform="translate(470,140)"><circle r="34" fill="url(#glowW)"/><rect x="-5" y="-20" width="10" height="12" rx="2" fill="#33323c"/><circle cy="4" r="13" fill="url(#bulbW)"/></g>
    <g transform="translate(545,180)"><circle r="34" fill="url(#glowW)"/><rect x="-5" y="-20" width="10" height="12" rx="2" fill="#33323c"/><circle cy="4" r="13" fill="url(#bulbW)"/></g>
  </g>

  <!-- soft floor reflection -->
  <ellipse cx="300" cy="360" rx="240" ry="26" fill="#ffd27a" opacity="0.05"/>
</svg>
