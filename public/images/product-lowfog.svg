<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Low fog-maskine der laver røggulv med is">
  <defs>
    <linearGradient id="lfbody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26252e"/>
      <stop offset="1" stop-color="#0e0d13"/>
    </linearGradient>
    <linearGradient id="fog1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd6e4" stop-opacity="0"/>
      <stop offset="1" stop-color="#cfd6e4" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#0d0c12"/>

  <!-- maskine -->
  <rect x="80" y="150" width="240" height="120" rx="14" fill="url(#lfbody)" stroke="#3a3944" stroke-width="3"/>
  <!-- låg med is-symbol -->
  <rect x="110" y="132" width="110" height="26" rx="8" fill="#17161d" stroke="#33323c" stroke-width="2.5"/>
  <g stroke="#7fc8ff" stroke-width="2.5" stroke-linecap="round">
    <path d="M165 138 v14 M158 141 l14 8 M172 141 l-14 8"/>
  </g>
  <!-- udblæsning -->
  <rect x="292" y="185" width="28" height="50" rx="6" fill="#0a0a0e" stroke="#33323c" stroke-width="2.5"/>
  <g fill="#26252e"><circle cx="306" cy="196" r="3"/><circle cx="306" cy="210" r="3"/><circle cx="306" cy="224" r="3"/></g>
  <!-- kontrolpanel -->
  <circle cx="120" cy="210" r="10" fill="#0a0a0e" stroke="#ffd600" stroke-width="2.5"/>
  <rect x="145" y="203" width="46" height="14" rx="7" fill="#0a0a0e" stroke="#33323c" stroke-width="2"/>
  <circle cx="210" cy="210" r="4" fill="#4ade80"/>
  <!-- lavtliggende røggulv -->
  <g>
    <ellipse cx="120" cy="330" rx="110" ry="26" fill="url(#fog1)"/>
    <ellipse cx="250" cy="340" rx="130" ry="28" fill="url(#fog1)" opacity="0.9"/>
    <ellipse cx="330" cy="325" rx="90" ry="22" fill="url(#fog1)" opacity="0.7"/>
    <ellipse cx="60" cy="345" rx="80" ry="20" fill="url(#fog1)" opacity="0.8"/>
    <ellipse cx="200" cy="352" rx="180" ry="22" fill="#cfd6e4" opacity="0.25"/>
  </g>
  <!-- røg der vælter ud af dysen ned mod gulvet -->
  <path d="M320 210 q40 10 44 60 q4 40 -30 55" fill="none" stroke="#cfd6e4" stroke-width="16" stroke-linecap="round" opacity="0.35"/>
</svg>
