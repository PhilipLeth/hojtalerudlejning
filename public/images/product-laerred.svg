<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Projektorlærred 160 cm på stativ">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f4f0"/>
      <stop offset="1" stop-color="#d8d6d0"/>
    </linearGradient>
    <linearGradient id="caseg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2b33"/>
      <stop offset="1" stop-color="#141318"/>
    </linearGradient>
  </defs>
  <rect width="400" height="440" fill="#0d0c12"/>
  <!-- top-kasse -->
  <rect x="60" y="52" width="280" height="26" rx="12" fill="url(#caseg)" stroke="#3a3944" stroke-width="2.5"/>
  <!-- lærred -->
  <rect x="76" y="78" width="248" height="182" fill="url(#canvas)"/>
  <rect x="76" y="78" width="248" height="182" fill="none" stroke="#0a0a0e" stroke-width="3"/>
  <!-- projektionsglød -->
  <rect x="92" y="94" width="216" height="150" fill="#ffd600" opacity="0.07"/>
  <!-- bundstang -->
  <rect x="150" y="260" width="100" height="10" rx="5" fill="#2c2b33" stroke="#3a3944" stroke-width="2"/>
  <!-- stativ -->
  <rect x="196" y="270" width="8" height="110" fill="#33323c"/>
  <path d="M200 380 L120 416 M200 380 L280 416 M200 380 L200 420" stroke="#33323c" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- 160 cm markering -->
  <path d="M90 292 h60 M250 292 h60" stroke="#3a3944" stroke-width="2"/>
  <text x="200" y="297" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffd600">160 cm</text>
  <ellipse cx="200" cy="428" rx="140" ry="10" fill="#ffd600" opacity="0.06"/>
</svg>
