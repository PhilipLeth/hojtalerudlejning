name: Sikkerhedskopi af KV

# Cloudflare KV har ingen fortryd, og Pages Functions har ingen cron. Kopien
# tages derfor herfra hver nat og lægges i R2 under backups/.
on:
  schedule:
    # 01:30 UTC = 03:30 dansk sommertid — efter dagens sidste ordrer
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Tag dagens kopi
        env:
          CRON_SECRET: ${{ secrets.SMS_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "SMS_CRON_SECRET mangler som GitHub-secret — springer over uden at fejle."
            exit 0
          fi
          out=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            https://lejhojtaler.dk/api/backup)
          code=$(printf '%s' "$out" | tail -n1)
          printf '%s\n' "$out" | sed '$d'
          if [ "$code" != "200" ]; then
            echo "Endepunktet svarede HTTP $code"
            exit 1
          fi
