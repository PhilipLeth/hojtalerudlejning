name: SMS-påmindelser

# Pages Functions har ingen cron, så dagens påmindelser trigges herfra:
# afhentning i dag og aflevering i dag. Endepunktet mærker hver ordre,
# så en ekstra kørsel ikke sender det samme to gange.
on:
  schedule:
    # 07:00 UTC = 09:00 dansk sommertid (08:00 om vinteren)
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  paamindelser:
    runs-on: ubuntu-latest
    steps:
      - name: Send dagens påmindelser
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          if [ -z "$ADMIN_SECRET" ]; then
            echo "ADMIN_SECRET mangler som GitHub-secret — springer over uden at fejle."
            exit 0
          fi
          out=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "X-Admin-Token: $ADMIN_SECRET" \
            https://lejhojtaler.dk/api/sms-paamindelser)
          code=$(printf '%s' "$out" | tail -n1)
          printf '%s\n' "$out" | sed '$d'
          if [ "$code" != "200" ]; then
            echo "Endepunktet svarede HTTP $code"
            exit 1
          fi
