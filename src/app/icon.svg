<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="g" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="25%" r="30%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Ball -->
  <circle cx="16" cy="16" r="14" fill="url(#g)"/>
  <!-- Grid lines (disco facets) -->
  <g stroke="#a16207" stroke-width="0.5" fill="none" opacity="0.4">
    <!-- Horizontal -->
    <ellipse cx="16" cy="8" rx="12.1" ry="1.5"/>
    <ellipse cx="16" cy="12" rx="13.5" ry="1"/>
    <line x1="2" y1="16" x2="30" y2="16"/>
    <ellipse cx="16" cy="20" rx="13.5" ry="1"/>
    <ellipse cx="16" cy="24" rx="12.1" ry="1.5"/>
    <!-- Vertical -->
    <ellipse cx="10" cy="16" rx="1" ry="13.5" transform="rotate(-15 10 16)"/>
    <ellipse cx="16" cy="16" rx="0.5" ry="14"/>
    <ellipse cx="22" cy="16" rx="1" ry="13.5" transform="rotate(15 22 16)"/>
  </g>
  <!-- Shine -->
  <circle cx="16" cy="16" r="14" fill="url(#shine)"/>
  <!-- Sparkles -->
  <g fill="#fff">
    <circle cx="10" cy="9" r="1.2" opacity="0.9"/>
    <circle cx="7" cy="13" r="0.7" opacity="0.6"/>
    <circle cx="13" cy="6" r="0.6" opacity="0.5"/>
    <circle cx="22" cy="7" r="0.5" opacity="0.4"/>
  </g>
  <!-- String -->
  <line x1="16" y1="2" x2="16" y2="0" stroke="#eab308" stroke-width="1" stroke-linecap="round"/>
</svg>
