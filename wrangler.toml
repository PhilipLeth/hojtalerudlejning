name = "furniture-viz"
pages_build_output_dir = "out"
# Moderne compat-dato er vigtig — ellers konverterer formData() fil-parts til
# strings i produktion (kendt bug fra lejhojtaler-projektet).
compatibility_date = "2026-08-01"

# id'et udfyldes automatisk af scripts/setup-cloudflare.sh (køres af CI)
[[kv_namespaces]]
binding = "DATA"
id = "INDSAET-KV-NAMESPACE-ID-HER"

# Oprettes automatisk af scripts/setup-cloudflare.sh
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "furniture-viz-media"
